<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LBOX — Prevención Inroute</title>
<style>
/* Contenedor principal centrado y con ancho máximo */
.app-wrapper, body > .app, #app, .container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 16px;
  box-sizing: border-box;
}

/* Grid para tarjetas de resumen (cards) */
.summary-grid {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(3, 1fr); /* 3 columnas por defecto */
  align-items: start;
}

/* Cada tarjeta mensual */
.month-card {
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  padding: 12px;
  min-height: 110px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Encabezado tarjeta */
.month-card .title {
  font-weight: 600;
  font-size: 0.98rem;
}

/* Contadores */
.atrib-counters {
  display: flex;
  gap: 8px;
  justify-content: space-between;
}
.atrib-item {
  flex: 1;
  background: #f7f7f8;
  padding: 6px 8px;
  border-radius: 6px;
  text-align: center;
  font-size: 0.9rem;
}
.atrib-item .num { font-weight:700; display:block; font-size:1.05rem; }

/* Barra visual simple */
.atrib-bar {
  display:flex;
  height: 10px;
  border-radius: 999px;
  overflow: hidden;
  background: #eee;
}
.atrib-bar > div { height: 100%; }

/* Colores por tipo (ajusta si gustas) */
.atrib-link { background: #4f46e5; } /* morado */
.atrib-inhib { background: #f97316; } /* naranja */
.atrib-rec { background: #10b981; } /* verde */

/* Responsividad */
@media (max-width: 1000px) {
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .summary-grid { grid-template-columns: 1fr; }
  .atrib-counters { flex-direction: column; }
}

/* Evitar que tablas desborden */
.table-responsive {
  width: 100%;
  overflow-x: auto;
}

/* Mejora de estética para tablas grandes */
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: auto;
  font-size: 0.95rem;
}
th, td {
  padding: 8px 10px;
  text-align: left;
}
</style>

<!-- ADDED: Script para generar el resumen mensual de Atribuciones -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  // Tipos de atribuciones esperados (normalizamos mayúsc/minúsc)
  const TIPOS = ['link','posible inhibición','posible inhibicion','recuperada','recuperado','recuperar'];

  // Intentamos encontrar un contenedor donde añadir el resumen mensual:
  function findMonthlyContainer() {
    const candidates = Array.from(document.querySelectorAll('section,div,main,header'));
    for (const el of candidates) {
      const txt = (el.id + ' ' + el.className + ' ' + (el.innerText||'')).toLowerCase();
      if (txt.includes('mensual') || txt.includes('resumen mensual') || txt.includes('monthly') || txt.includes('resumen')) return el;
    }
    return document.body;
  }

  function extractRowsFromTables() {
    const rows = [];
    const tables = Array.from(document.querySelectorAll('table'));
    for (const table of tables) {
      const headers = Array.from(table.querySelectorAll('thead th')).map(th=>th.innerText.trim().toLowerCase());
      const ths = headers.length ? headers : Array.from(table.querySelectorAll('tr')).slice(0,1).map(r=>Array.from(r.cells).map(c=>c.innerText.trim().toLowerCase())).flat();
      const dateIdx = headers.findIndex(h => h.includes('fecha') || h.includes('date') || h.includes('dia') || h.includes('día') );
      const atribIdx = headers.findIndex(h => h.includes('atrib') || h.includes('atribución') || h.includes('asigna') || h.includes('atru'));
      const bodyRows = Array.from(table.querySelectorAll('tbody tr'));
      for (const r of bodyRows) {
        const cells = Array.from(r.cells).map(c=>c.innerText.trim());
        let dateText = '';
        let atribText = '';
        if (dateIdx >= 0 && cells[dateIdx]) dateText = cells[dateIdx];
        if (atribIdx >= 0 && cells[atribIdx]) atribText = cells[atribIdx];
        if (!atribText) {
          for (const c of cells) {
            const low = c.toLowerCase();
            if (TIPOS.some(t => low.includes(t))) { atribText = c; break; }
          }
        }
        if (!dateText) {
          for (const c of cells) {
            if (/\d{4}/.test(c) || /\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/.test(c)) { dateText = c; break; }
          }
        }
        if (atribText || dateText) rows.push({date: dateText, atrib: atribText});
      }
    }
    return rows;
  }

  function monthKeyFromDateText(s) {
    if (!s) return 'Sin fecha';
    const d = new Date(s);
    if (!isNaN(d)) {
      const mm = (d.getMonth()+1).toString().padStart(2,'0');
      const yy = d.getFullYear();
      return mm + '-' + yy;
    }
    const m1 = s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if (m1) {
      const mm = m1[2].padStart(2,'0');
      const yy = (m1[3].length===2?('20'+m1[3]):m1[3]);
      return mm + '-' + yy;
    }
    const m2 = s.match(/(0?[1-9]|1[012])[\/\-](\d{2,4})/);
    if (m2) {
      const mm = m2[1].padStart(2,'0');
      const yy = (m2[2].length===2?('20'+m2[2]):m2[2]);
      return mm + '-' + yy;
    }
    const y = s.match(/(20\d{2}|\d{4})/);
    if (y) return '01-' + y[0];
    return 'Sin fecha';
  }

  function normalizeAtrib(s) {
    if (!s) return 'Otro';
    const low = s.toLowerCase();
    if (low.includes('link')) return 'Link';
    if (low.includes('inhib') || low.includes('posible inhib')) return 'Posible inhibición';
    if (low.includes('recup') || low.includes('recupera')) return 'Recuperada';
    if (low.includes('recuperada') || low.includes('recuperado')) return 'Recuperada';
    return 'Otro';
  }

  function aggregate(rows) {
    const agg = {};
    for (const r of rows) {
      const key = monthKeyFromDateText(r.date);
      const tipo = normalizeAtrib(r.atrib);
      if (!agg[key]) agg[key] = { Link:0, 'Posible inhibición':0, Recuperada:0, Otro:0 };
      if (agg[key][tipo] !== undefined) agg[key][tipo]++; else agg[key]['Otro']++;
    }
    return agg;
  }

  function renderSummary(agg, targetContainer) {
    let wrapper = targetContainer.querySelector('.atribuciones-monthly-wrapper');
    if (!wrapper) {
      wrapper = document.createElement('div');
      wrapper.className = 'atribuciones-monthly-wrapper';
      const h = document.createElement('h3');
      h.textContent = 'Atribuciones — resumen mensual';
      h.style.margin = '8px 0 12px';
      wrapper.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'summary-grid';
      wrapper.appendChild(grid);
      targetContainer.prepend(wrapper);
    }
    const grid = wrapper.querySelector('.summary-grid');
    grid.innerHTML = '';
    const keys = Object.keys(agg).sort((a,b)=> (a<b?1:-1));
    for (const k of keys) {
      const data = agg[k];
      const total = (data.Link||0) + (data['Posible inhibición']||0) + (data.Recuperada||0) + (data.Otro||0);
      const card = document.createElement('div');
      card.className = 'month-card';
      card.innerHTML = `
        <div class="title">${k} — Total: ${total}</div>
        <div class="atrib-counters">
          <div class="atrib-item"><span class="label">Link</span><span class="num">${data.Link||0}</span></div>
          <div class="atrib-item"><span class="label">Posible inhibición</span><span class="num">${data['Posible inhibición']||0}</span></div>
          <div class="atrib-item"><span class="label">Recuperada</span><span class="num">${data.Recuperada||0}</span></div>
        </div>
        <div class="atrib-bar" aria-hidden="true">
          <div class="atrib-link" style="width:${total?Math.round((data.Link/total)*100):0}%"></div>
          <div class="atrib-inhib" style="width:${total?Math.round((data['Posible inhibición']/total)*100):0}%"></div>
          <div class="atrib-rec" style="width:${total?Math.round((data.Recuperada/total)*100):0}%"></div>
        </div>
      `;
      grid.appendChild(card);
    }
  }

  const rows = extractRowsFromTables();
  if (rows.length === 0) {
    console.warn('No se encontraron filas / tablas con fecha/atribución. Si los datos vienen desde backend/GS, asegúrate de que la tabla incluya la columna de Atribuciones o añadir data-atribucion en cada fila.');
    return;
  }
  const agg = aggregate(rows);
  const target = findMonthlyContainer();
  renderSummary(agg, target);
});
</script>
